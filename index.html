<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <meta name="description" content="Unsplash photo viewer built with Vue 3">
    <!-- Self-hosted font, preloaded so the text swap happens before first paint -->
    <link rel="preload" href="%BASE_URL%fonts/quicksand-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Open the API and image connections while the app bundle is still loading -->
    <link rel="preconnect" href="https://api.unsplash.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
